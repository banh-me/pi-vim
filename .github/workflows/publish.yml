name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # required for OIDC trusted publishing + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build.
          package-manager-cache: false

      # This package has no dependencies of its own: it imports the host
      # packages as peers, which pi supplies at runtime. Type checking needs
      # them present. Must be a single npm install -- separate invocations
      # prune the previously --no-save'd packages.
      - name: Type check
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            typescript@7 @types/node \
            @earendil-works/pi-coding-agent@1.3.0 \
            @earendil-works/pi-tui@1.3.0
          npx tsc --noEmit

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish --provenance --access public
